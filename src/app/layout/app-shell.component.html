<div class="grid grid-nogutter m-0 min-h-screen">
  <aside
    class="col-12 md:col-4 lg:col-3 xl:col-2 flex flex-column gap-4 p-4 surface-card border-right-1 surface-border"
  >
    <div class="flex align-items-center gap-3">
      <p-avatar label="F" shape="circle" size="large" styleClass="bg-primary" />
      <div class="flex flex-column">
        <span class="font-bold">{{ appName }}</span>
        <span class="text-color-secondary text-sm">Panel corporativo</span>
      </div>
    </div>

    <nav class="flex flex-column gap-1">
      @for (item of menuItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary-50 text-primary-700 font-semibold"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex align-items-center gap-3 px-3 py-2 border-round text-color hover:surface-100 transition-colors transition-duration-150"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <p-badge value="v{{ appVersion }}" severity="secondary" styleClass="mt-auto align-self-start" />
  </aside>

  <div class="col-12 md:col-8 lg:col-9 xl:col-10 flex flex-column">
    <header
      class="flex align-items-center justify-content-between flex-wrap gap-3 p-4 surface-card border-bottom-1 surface-border"
    >
      <div class="flex flex-column">
        <span class="text-color-secondary text-sm font-medium">{{ appName }}</span>
        <h1 class="m-0 text-2xl">Administración</h1>
      </div>

      <div class="flex align-items-center gap-3">
        <div class="flex align-items-center gap-2">
          <p-avatar icon="pi pi-user" shape="circle" />
          <div class="flex flex-column min-w-0">
            <span class="font-semibold white-space-nowrap overflow-hidden text-overflow-ellipsis w-10rem">{{
              currentUserEmail
            }}</span>
            <span class="text-color-secondary text-sm">{{ currentDocumento }}</span>
          </div>
        </div>

        <p-button
          icon="pi pi-sign-out"
          label="Salir"
          severity="secondary"
          [text]="true"
          (click)="logout()"
        />
      </div>
    </header>

    <main class="p-4 flex-1">
      <router-outlet />
    </main>
  </div>
</div>
